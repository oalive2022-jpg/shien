databases:
  - name: shien-kiroku-db
    plan: free
    databaseName: shien_kiroku
    user: shien_kiroku

services:
  - type: web
    name: shien-kiroku
    plan: free
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shien-kiroku-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: APP_DOMAIN
        value: ""
      - key: ALLOWED_ORIGINS
        value: ""
